name: Build Device Security Center Portal
on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/build-device-security-portal.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/build-device-security-portal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: portal/pom.xml
      - name: Test and package standalone portal
        run: mvn -B -f portal/pom.xml clean verify
