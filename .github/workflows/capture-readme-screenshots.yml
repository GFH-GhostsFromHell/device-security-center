name: Capture GHOST PROTOCOL README Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-readme-screenshots.cjs'
      - '.github/workflows/capture-readme-screenshots.yml'
      - 'portal/src/main/resources/static/device-security.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for static UI screenshots
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture source-code web interface without real accounts
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory portal/src/main/resources/static >/tmp/device-security-preview.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8765/device-security.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-readme-screenshots.cjs
      - name: Commit web UI screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots already up to date."
          else
            git commit -m "docs: capture real GHOST PROTOCOL web UI"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
